name: Branchlight checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: branchlight_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d branchlight_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BRANCHLIGHT_MODE: local
      DATABASE_MIGRATION_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/branchlight_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high
